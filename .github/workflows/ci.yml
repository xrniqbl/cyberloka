name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check cyberloka tests || true   # non-blocking dulu

      - name: AST parse sanity
        run: |
          python - <<'PY'
          import ast, os
          for r,_,fs in os.walk("cyberloka"):
              for f in fs:
                  if f.endswith(".py"):
                      ast.parse(open(os.path.join(r,f)).read(), os.path.join(r,f))
          print("ok")
          PY

      - name: Unit tests
        run: pytest -q

  integration-juiceshop:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    services:
      juiceshop:
        image: bkimminich/juice-shop:latest
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Wait for Juice Shop
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:3000/ > /dev/null; then
              echo "ready"; exit 0
            fi
            sleep 2
          done
          echo "Juice Shop not ready"; exit 1

      - name: Run Cyberloka passive scan
        run: |
          python -m cyberloka -t http://127.0.0.1:3000 \
            --mode passive --quiet \
            --json juiceshop.json --html juiceshop.html

      - name: Run integration tests
        env:
          CYBERLOKA_LAB: "1"
        run: pytest -q tests/test_integration_lab.py

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juiceshop-report
          path: |
            juiceshop.json
            juiceshop.html
