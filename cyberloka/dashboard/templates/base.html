<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Cyberloka Dashboard{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
<nav class="topbar">
  <div class="brand">
    <a href="{{ url_for('index') }}">CYBERLOKA</a>
    <span class="muted">dashboard</span>
  </div>
  <div class="nav-links">
    <a href="{{ url_for('index') }}">Scans</a>
    <a href="{{ url_for('compare') }}">Compare</a>
  </div>
  <div class="reports-dir muted" title="Reports directory">{{ reports_dir }}</div>
</nav>

<main class="container">
{% block content %}{% endblock %}
</main>

<footer class="foot muted">
  Cyberloka {{ tool_version }}
</footer>

<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
