[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberloka"
version = "0.1.0"
description = "Cyberloka - Web vulnerability scanner & remediation advisor (Python)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Cyberloka contributors" }]
keywords = ["security", "pentest", "scanner", "vulnerability", "owasp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "dnspython>=2.4.0",
    "python-whois>=0.9.4",
    "cryptography>=41.0.0",
    "rich>=13.7.0",
    "jinja2>=3.1.2",
    "beautifulsoup4>=4.12.0",
    "tldextract>=5.0.0",
    "reportlab>=4.0.0",
]

[project.scripts]
cyberloka = "cyberloka.cli:main"

[project.urls]
Homepage = "https://github.com/xrniqbl/cyberloka"

[tool.setuptools.packages.find]
include = ["cyberloka*"]

[tool.setuptools.package-data]
cyberloka = ["data/*.txt", "reporting/templates/*.html"]
